<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Galería 3D</title>
  <link rel="stylesheet" href="style.css">
  <link rel="icon" href="../favicon.png" type="image/png">

  <!-- BabylonJS -->
  <script src="https://cdn.babylonjs.com/babylon.js"></script>
  <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
  <script src="https://cdn.babylonjs.com/gui/babylon.gui.min.js"></script>
</head>

<body>
  
  <!-- Joystick móviles -->
<div id="joystickContainer" style="display:none;">
  <div id="joystick"></div>
</div>

  <!-- Canvas 3D -->
  <canvas id="renderCanvas"></canvas>

  <!-- Ventana emergente (descripción de obra) -->
  <div id="popup" class="popup">
    <div class="popup-content">
      <h2 id="popupTitle"></h2>
      <img id="popupImg" src="" alt="Vista de la obra">
      <p id="popupDesc"></p>
      <span id="closePopup" class="close">×</span>
    </div>
  </div>

  <!-- Intro con logo animado -->
<div id="customLoading">
  <video autoplay muted playsinline id="intro-video">
    <source src="Galeria_3D/intro.mp4" type="video/mp4">
  </video>
</div>
  <!-- Script principal -->
  <script src="script.js"></script>
</body>
</html>
